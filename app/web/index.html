<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词判别 · 原型</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1a1f36;
    --ink-soft: #5b6472;
    --ink-faint: #9aa3b2;
    --line: #e6e9f2;
    --primary: #4f46e5;
    --primary-soft: #eef2ff;
    --good: #10b981;
    --good-soft: #ecfdf5;
    --bad: #ef4444;
    --bad-soft: #fef2f2;
    --focus: #f59e0b;
    --radius-lg: 20px;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 8px 30px rgba(31, 35, 51, .08);
    --shadow-sm: 0 2px 10px rgba(31, 35, 51, .06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
    padding: 18px 12px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%; max-width: 430px;
    display: flex; flex-direction: column; gap: 14px;
  }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 2px;
  }
  .progress {
    font-size: 13px; color: var(--ink-faint); display: flex; align-items: center; gap: 8px;
  }
  .progress .bar {
    width: 110px; height: 5px; border-radius: 999px; background: var(--line); overflow: hidden;
  }
  .progress .bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
  .stats { font-size: 12px; color: var(--ink-faint); }
  .stats b { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* 题干卡 */
  .question {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 26px 22px 22px;
    box-shadow: var(--shadow);
  }
  .word-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .word-badge {
    font-weight: 700; font-size: 22px; letter-spacing: .02em;
    color: var(--primary); display: inline-flex; align-items: center; gap: 6px;
  }
  .word-badge.speakable { cursor: pointer; border-bottom: 2px solid var(--primary-soft); }
  .word-badge.speakable:hover { border-bottom-color: var(--primary); }
  .word-badge.speakable:active { opacity: .6; }
  .tag-line .ipa { font-family: "Segoe UI", "Times New Roman", serif; letter-spacing: .3px; }
  .word-badge small {
    font-size: 12px; font-weight: 500; color: var(--ink-faint);
    background: var(--line); padding: 3px 8px; border-radius: 999px;
  }
  .tag-line { font-size: 12px; color: var(--ink-faint); }
  .tag-line .trap {
    color: var(--focus); background: #fff7e8; padding: 3px 8px; border-radius: 999px;
    font-weight: 600;
  }
  .tag-line .tier {
    color: var(--ink-faint); background: var(--line);
    padding: 3px 8px; border-radius: 999px;
  }

  /* D16：该义项暂无例句 */
  .nosent { text-align: center; padding: 28px 12px; }
  .nosent-title {
    font-size: 26px; font-weight: 700; color: var(--ink);
    font-family: var(--serif); letter-spacing: .2px;
  }
  .nosent-pos { font-size: 14px; font-weight: 400; color: var(--ink-faint); }
  .nosent-gloss {
    margin-top: 14px; font-size: 20px; color: var(--primary); font-weight: 600;
  }
  .nosent-note { margin-top: 22px; font-size: 15px; color: var(--ink-dim); }
  .nosent-sub { margin-top: 6px; font-size: 13px; color: var(--ink-faint); }
  .sentence {
    font-size: 20px; line-height: 1.7; color: var(--ink);
    caret-color: transparent;
  }
  .sentence mark {
    background: var(--primary);
    color: #fff; border-radius: 6px;
    padding: 1px 5px; font-weight: 700;
  }
  .sentence legend { display: block; font-size: 12px; color: var(--ink-faint); margin-bottom: 6px; }

  /* 判别区：先空白，点击揭示 */
  .reveal-area { margin-top: 22px; }
  .hint {
    font-size: 13px; color: var(--ink-faint); text-align: center; margin-bottom: 10px;
  }
  .blank-box {
    border: 2px dashed #cdd3e2; border-radius: var(--radius);
    min-height: 74px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); cursor: pointer; font-size: 15px; font-weight: 500;
    transition: border-color .15s, background .15s, transform .05s;
    background: #fbfcff;
    user-select: none;
  }
  .blank-box:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
  .blank-box:active { transform: scale(.99); }

  .giveup {
    margin-top: 14px; text-align: center;
  }
  .giveup a {
    color: var(--ink-faint); font-size: 13px; font-weight: 500;
    text-decoration: none; cursor: pointer;
    border-bottom: 1px dashed transparent; transition: color .15s;
    user-select: none; display: inline-block; padding: 6px 12px;
  }
  .giveup a:hover { color: var(--ink-soft); border-bottom-color: var(--ink-faint); }

  .options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 4px;
    animation: rise .22s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .opt {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 12px;
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: var(--radius); cursor: pointer;
    font-size: 15px; color: var(--ink);
    box-shadow: var(--shadow-sm);
    transition: border-color .12s, transform .06s, background .12s, opacity .2s;
    user-select: none;
  }
  .opt:hover { border-color: #c2c9dd; }
  .opt:active { transform: scale(.985); }
  .opt .key {
    width: 26px; height: 26px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--line); color: var(--ink-soft);
    border-radius: 8px; font-size: 13px; font-weight: 700;
  }
  .opt .en { color: var(--ink-faint); font-size: 13px; margin-top: 1px; }
  .opt .body { flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
  .opt.full { grid-column: 1 / -1; }
  .opt.correct {
    border-color: var(--good); background: var(--good-soft); color: #065f46;
  }
  .opt.correct .key { background: var(--good); color: #fff; }
  .opt.wrong {
    border-color: var(--bad); background: var(--bad-soft); color: #991b1b;
  }
  .opt.wrong .key { background: var(--bad); color: #fff; }
  .opt.dim { opacity: .42; border-color: var(--line); background: #fff; }
  .opt.disabled { pointer-events: none; }

  /* 讲解 */
  .explain {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 20px 22px 16px;
    box-shadow: var(--shadow);
    display: none;
    animation: rise .22s ease;
  }
  .explain .result-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .explain .chip {
    display: inline-flex; align-items: center;
    padding: 5px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 700; flex: none;
  }
  .explain .result-row.good .chip { background: var(--good-soft); color: #047857; }
  .explain .result-row.bad .chip { background: var(--bad-soft); color: #b91c1c; }
  .explain .result-row.pending .chip { background: #fff7e8; color: #b45309; }
  .explain .correct-ans {
    font-size: 18px; font-weight: 700; color: var(--ink);
  }
  .explain .correct-ans b { color: var(--primary); }
  .explain .trans { font-size: 15px; color: var(--ink-soft); line-height: 1.7; }
  .explain .trans b { color: var(--ink); }
  .explain .note {
    font-size: 14px; color: var(--ink-soft); line-height: 1.7;
    border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px;
  }

  /* 动作 */
  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1; padding: 14px; border: none; border-radius: var(--radius);
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .06s, opacity .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.ghost { background: transparent; color: var(--ink-soft); font-weight: 600; }
  .btn.secondary { background: var(--line); color: var(--ink-soft); }

  /* 会话结束 */
  .session-end {
    background: var(--card); border-radius: var(--radius-lg); padding: 40px 22px;
    text-align: center; box-shadow: var(--shadow);
  }
  .session-end .big { font-size: 44px; margin-bottom: 12px; }
  .session-end h2 { font-size: 20px; margin-bottom: 6px; }
  .session-end p { color: var(--ink-soft); font-size: 15px; line-height: 1.8; }

  .fade-enter { animation: rise .25s ease; }

  /* 底部 tab */
  .tabbar {
    display: flex; gap: 6px; padding: 6px;
    background: var(--card); border-radius: 16px;
    box-shadow: var(--shadow-sm);
  }
  .tab {
    flex: 1; text-align: center; padding: 12px;
    font-size: 14px; font-weight: 700; color: var(--ink-faint);
    border-radius: 12px; cursor: pointer; user-select: none;
    transition: background .15s, color .15s;
  }
  .tab.active { background: var(--primary-soft); color: var(--primary); }

  /* 主列：窄屏时 tabbar 仍在其下方（原布局）；宽屏（>=900px）时 tabbar
     移到左侧成竖排导航，内容列居右 —— 桌面浏览器里不用把手指伸到页底。 */
  .main {
    display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  @media (min-width: 900px) {
    body { padding: 24px 20px 40px; }
    .app {
      max-width: 860px;
      flex-direction: row;
      align-items: flex-start;
      gap: 18px;
    }
    .main { flex: 1; max-width: 620px; }
    .tabbar {
      flex: 0 0 108px;
      flex-direction: column;
      position: sticky; top: 18px;
    }
    .tab { flex: none; white-space: nowrap; }
  }

  /* 单挑横幅 */
  .solo-banner {
    background: var(--primary-soft); color: var(--primary);
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 13px; font-weight: 600; text-align: center;
  }

  /* 复学标记：这张卡之前见过（显示上次作答结果与时间） */
  .card-meta {
    margin: 4px 0 0; font-size: 12px; color: var(--muted, #888);
  }

  /* 服务端不可用横幅：降级到本地排序时显式告知，不再静默 */
  .fallback-banner {
    background: #fdecea; color: #a93226;
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 13px; font-weight: 600; text-align: center;
    margin-bottom: 10px;
  }

  /* 错题板 */
  .board {
    background: var(--card); border-radius: var(--radius-lg);
    padding: 20px; box-shadow: var(--shadow);
  }
  .board-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .board-head h3 { font-size: 18px; }
  .board-count { font-size: 13px; color: var(--ink-faint); }
  /* 列表限高内滚：条目再多也不把页面无限撑长，页头和侧栏始终可见 */
  .board-list {
    display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 230px);
    overflow-y: auto; padding-right: 2px;
  }
  .worst-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; border: 1.5px solid var(--line); border-radius: var(--radius);
    cursor: pointer; transition: border-color .12s, background .12s;
  }
  .worst-item:hover { border-color: var(--primary); background: var(--primary-soft); }
  .worst-item .badge {
    flex: none; padding: 3px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
  }
  .worst-item .badge.hot { background: var(--bad-soft); color: #b91c1c; }
  .worst-item .badge.cold { background: #fff7e8; color: #b45309; }
  .worst-item .word { font-weight: 700; font-size: 16px; }
  .worst-item .sub { font-size: 13px; color: var(--ink-faint); margin-top: 2px; }
  .worst-item .go { margin-left: auto; color: var(--ink-faint); font-size: 15px; }
  .board-empty {
    padding: 40px 0; text-align: center; color: var(--ink-faint); font-size: 14px;
  }

  /* 小结页 */
  .summary {
    background: var(--card); border-radius: var(--radius-lg); padding: 26px 22px;
    box-shadow: var(--shadow);
  }
  .summary h2 { font-size: 20px; margin-bottom: 16px; }
  .summary .block { margin-bottom: 16px; }
  .summary .block .label { font-size: 13px; color: var(--ink-faint); margin-bottom: 8px; }
  .summary .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .summary .stat {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 12px 8px; text-align: center;
  }
  .summary .stat b { display: block; font-size: 20px; }
  .summary .stat span { font-size: 12px; color: var(--ink-faint); }
  .summary .stat.good b { color: var(--good); }
  .summary .stat.bad b { color: var(--bad); }
  .summary .stat.pending b { color: var(--focus); }
  .summary .miss-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .summary .miss-item {
    padding: 7px 12px; background: var(--bad-soft); color: #b91c1c;
    border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .summary .miss-item:hover { background: #ffe4e4; }
  .summary .done-line { font-size: 14px; color: var(--ink-soft); }
  .summary .actions { margin-top: 20px; }

  /* 我已学会 / 单挑完成行 */
  .master-line { text-align: right; font-size: 13px; }
  .master-line a {
    color: var(--primary); font-weight: 600; cursor: pointer;
    border-bottom: 1px dashed var(--primary);
  }
  .master-line a:hover { opacity: .8; }
  .mastered-line { text-align: right; color: var(--good); font-weight: 600; font-size: 13px; }
  .solo-done { color: var(--good); font-weight: 700; }

  /* D17：标记「这句有问题」 */
  .flag-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .flag-line > span:first-child { color: var(--ink-faint); font-size: 13px; white-space: nowrap; }
  .flag-input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 6px 10px; background: #fbfcff; color: var(--ink);
  }
  .flag-input:focus { outline: none; border-color: var(--primary); }
  .btn.tiny { padding: 6px 12px; font-size: 13px; border-radius: var(--radius-sm); }
  .flag-hint { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .flagged-ok { color: var(--good); font-size: 13px; font-weight: 600; }
  .flag-bad { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink-soft);z-index:99">正在加载词库…</div>
  <div class="app" id="appBody">
  <div class="main">
  <div class="topbar">
    <div class="progress">
      <span id="progressText">0 / 0</span>
      <div class="bar"><i id="progressFill" style="width:0%"></i></div>
      <span class="stats" id="statsLine"></span>
    </div>
  </div>

  <div class="fallback-banner" id="fallbackBanner" style="display:none">
    服务端队列不可用：当前为本地排序兜底，作答不会写入数据库
  </div>

  <div id="viewTrain">
    <div class="question">
      <div class="word-row">
        <span class="word-badge" id="wordBadge"></span>
        <span class="tag-line" id="tagLine"></span>
      </div>
      <p class="sentence" id="sentence"></p>
      <p class="card-meta" id="cardMeta" style="display:none"></p>
      <div class="reveal-area">
        <div class="hint" id="hint">想清楚这个词在这里的意思</div>
        <div class="blank-box" id="blankBox" onclick="revealOptions()">— 点击空白处显示选项 —</div>
        <div class="giveup" id="giveupStage1"><a onclick="giveUpNow()">我不会</a></div>
        <div class="options" id="options" style="display:none"></div>
        <div class="actions" id="actions" style="display:none"></div>
      </div>
    </div>
    <div class="explain" id="explain"></div>
    <div class="solo-banner" id="soloBanner" style="display:none">
      单挑：训练这一对子，连续 2 次答对即从错题板移除
    </div>
  </div>

  <div id="viewBoard" style="display:none">
    <div class="board">
      <div class="board-head">
        <h3>错题板</h3>
        <span class="board-count" id="boardCount"></span>
      </div>
      <div class="board-list" id="boardList"></div>
    </div>
  </div>

  <div id="viewHistory" style="display:none">
    <div class="board">
      <div class="board-head">
        <h3>学过的题</h3>
        <span class="board-count" id="historyCount"></span>
      </div>
      <div class="board-list" id="historyList"></div>
    </div>
  </div>

  <div id="viewSummary" style="display:none"></div>
  </div><!-- /.main -->

  <div class="tabbar">
    <div class="tab" id="tabTrain" onclick="switchTab('train')">训练</div>
    <div class="tab" id="tabBoard" onclick="switchTab('board')">错题板</div>
    <div class="tab" id="tabHistory" onclick="switchTab('history')">记录</div>
  </div>
</div>

<script>

/* =========================================================================
   数据：一次性加载 bundle（义项级卡片），不再逐词 fetch
   ========================================================================= */
const BUNDLE_URL = "/build/bundle/cards.json";
const STORE_KEY = "wordjudge.v2";

let BUNDLE = null;
let CARDS = [];
let GLOSS = [];          // 跨词干扰项池
let card = null;         // 当前义项卡
let row = null;          // 当前句
let options = [];
let renderedOptions = null;

let revealed = false, answered = false;
let solo = null;         // {id, chain}
let cardShownAt = 0;     // D17：本次出题时刻，算作答耗时

/* 会话状态（全部持久化） */
let state = null;

function freshState(){
  return {
    v: 2,
    queue: [],            // 本轮待练义项 id
    pos: 0,               // 当前在 queue 中的位置
    stats: {correct:0, wrong:0, pending:0},
    wrong: {},            // id -> {id, w, s, zh, wrongCount, lastKind}
    mastered: {},         // id -> true
    rowIdx: {},           // id -> 下一句索引（轮换）
    updatedAt: 0,
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshState();
    const s = JSON.parse(raw);
    if (s.v !== 2) return freshState();
    return Object.assign(freshState(), s);
  }catch(e){
    return freshState();
  }
}
function saveState(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ /* 隐私模式下忽略 */ }
  pushState();
}

/* =========================================================================
   D17 · 服务端存档
   ---------------------------------------------------------------------------
   上面那两行是原型原样保留的：localStorage 仍是前端的真相源（离线可用、秒开）。
   这里额外接一层 SQLite（app/server.mjs + data/user.db），只解决 localStorage
   解决不了的两件事：

     1. 清缓存 / 换浏览器 / 换机器 -> 从 SQLite 恢复这一轮的 queue 与进度
     2. 每次作答在服务端独立留痕 -> SRS（S/D/due_at）不依赖前端是否打开

   失败一律静默：存档是附加能力，不能让它把练习搞挂。
   ========================================================================= */
const API = {
  get(p){ return fetch(p, {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null); },
  post(p, body){
    return fetch(p, {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify(body),
    }).then(r => r.ok ? r.json() : null).catch(() => null);
  },
};

let _pushTimer = null;
let SERVER_LIVE = {};        // D17：服务端给的「每张卡还能用的句子下标」
let LASTSEEN = {};           // id -> {result, ts}：这张卡最近一次作答（来自服务端流水），复学标记用
let DUE_TOTAL = null;        // 服务端到期池大小（/api/queue 的 dueTotal），null = 未知
let ROUND_META = null;       // {fresh, review}：本轮构成（新卡 / 复学卡各几张）
let WORD_TOTAL = 0;          // 池子里的词数（义项按词去重）
function pushState(){
  if (!state || _pushTimer) return;
  // 连续点击「下一题」时合并成一次推送，别每题都写一遍
  _pushTimer = setTimeout(() => { _pushTimer = null; API.post("/api/ui-state", {state}); }, 400);
}

/** 记一次作答。result: CORRECT / WRONG / PENDING。返回里带 SRS 数值。 */
function commitAnswer(result, elapsedMs){
  if (!card) return Promise.resolve(null);
  LASTSEEN[card.id] = { result, ts: Math.floor(Date.now() / 1000) };   // 本会话内复现（单挑等）也能显示标记
  return API.post("/api/answer", {
    word: card.word, senseId: card.senseId, sentence: row ? row.text : null,
    result, elapsedMs: elapsedMs ?? null,
  });
}
function commitMastered(id){
  const c = CARDS.find(x => x.id === id);
  if (!c) return Promise.resolve(null);
  return API.post("/api/mastered", {word: c.word, senseId: c.senseId, on: true});
}

/* =========================================================================
   D18 · 朗读
   ---------------------------------------------------------------------------
   音标来自 CMUdict（免费离线，已烘进 bundle 的 card.ipa，按词性选读音）。
   发音用浏览器内置的 speechSynthesis —— 零安装、零成本、不联网、不调服务。

   代价要说清楚：**音色取决于这台机器**。
     · Windows 桌面版只有系统自带的 Microsoft Zira，音质一般
     · 手机 Chrome 走 Google TTS，好得多
   所以这是「先跑通」的方案。真嫌难听再换本地 piper（同样免费离线，
   但要 pip install piper-tts + 下 63MB 模型），只换这一段即可。
   ========================================================================= */
let VOICE = null;
function pickVoice(){
  if (!window.speechSynthesis) return null;
  let vs = [];
  try { vs = speechSynthesis.getVoices() || []; } catch(e){ return null; }
  if (!vs.length) return null;
  VOICE = vs.find(v => /^en[-_]US/i.test(v.lang) && !v.localService)
       || vs.find(v => /^en[-_]US/i.test(v.lang))
       || vs.find(v => /^en[-_]/i.test(v.lang))
       || null;
  return VOICE;
}
if (window.speechSynthesis){
  pickVoice();
  try { speechSynthesis.onvoiceschanged = pickVoice; } catch(e){ /* 老浏览器没这个事件 */ }
}
function canSpeak(){ return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); }

function speak(text, slow){
  if (!canSpeak() || !text) return false;
  try { speechSynthesis.cancel(); } catch(e){}
  if (!VOICE) pickVoice();
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = "en-US";
  u.rate = slow ? 0.75 : 1.0;          // 读句子慢一点听得清
  if (VOICE) u.voice = VOICE;
  try { speechSynthesis.speak(u); } catch(e){ return false; }
  return true;
}
function speakWord(){ if (card) speak(card.word, false); }
function speakSentence(){ if (row) speak(row.text, true); }

/* 这句有问题：填备注 → 点「提交」。**下一题不会自动提交**，
 * 没提交就点下一题等于放弃这条备注（换题后这一行会重画）。
 * 事后跑 scripts/triage_flags.py 拿清单统一改。 */
function flagSentence(){
  if (!card || !row) return;
  const btn = document.getElementById("flagGo");
  const input = document.getElementById("flagNote");
  const note = input ? input.value.trim() : "";
  if (btn){ btn.disabled = true; btn.textContent = "提交中"; }
  API.post("/api/flag", {word: card.word, senseId: card.senseId, sentence: row.text, note})
    .then(r => {
      const line = document.querySelector(".flag-line");
      const hint = document.querySelector(".flag-hint");
      if (hint) hint.remove();
      if (!line) return;
      if (r && r.ok){
        line.innerHTML = `<span class="flagged-ok">✓ 已提交，不再出这句` +
          (note ? `（${esc(note)}）` : "") + `</span>`;
      } else {
        line.innerHTML = `<span class="flag-bad">提交失败：${esc((r && r.error) || "未知原因")}</span>`;
        if (btn){ btn.disabled = false; btn.textContent = "重试"; }
      }
    }).catch(() => {
      const line = document.querySelector(".flag-line");
      if (line) line.innerHTML = `<span class="flag-bad">提交失败：连不上服务</span>`;
      if (btn){ btn.disabled = false; btn.textContent = "重试"; }
    });
}

/** 本地没有存档时，从 SQLite 恢复。返回是否有可恢复的内容。 */
function restoreFromServer(){
  return API.get("/api/ui-state").then(r => {
    if (!r || !r.state || !r.state.v) return false;
    // 本地已有进度就不覆盖：localStorage 是真相源，服务端只是备份
    const mine = localStorage.getItem(STORE_KEY);
    if (mine) return false;
    state = Object.assign(freshState(), r.state);
    saveState();
    return true;
  });
}

/* =========================================================================
   练习队列
   ========================================================================= */
function pickQueue(size){
  // D16：没有例句的义项不出题（它没法出题），只在空状态里提示
  const pool = CARDS.filter(c => !state.mastered[c.id] && hasRows(c));
  // TRAP 义项优先，其次错题
  const wrongIds = new Set(Object.keys(state.wrong));
  const rank = c => (wrongIds.has(c.id) ? 0 : 1) * 10 + (c.trap ? 0 : 1);
  pool.sort((a,b) => rank(a) - rank(b) || a.id.localeCompare(b.id));
  return pool.slice(0, size).map(c => c.id);
}

/** D17：向服务端要本轮队列。
 *  服务端按 SRS 到期 + 权重排（03 §5.2），并剔除已被标记的问题句；
 *  前端自己的 pickQueue 只作兜底（离线 / 纯静态打开时用）。
 *  恢复上一轮时也要调 —— 只取 live（可用句子下标），不用它的 ids。
 *  返回服务端给的完整结果，失败返回 null。 */
function fetchQueue(size){
  return API.post("/api/queue", {n: size}).then(q => {
    if (!q || !Array.isArray(q.ids)) return null;
    SERVER_LIVE = q.live || {};
    DUE_TOTAL = (typeof q.dueTotal === "number") ? q.dueTotal : null;
    return q;
  }).catch(() => null);
}

/** 服务端不可用时的显式降级提示（以前是静默退回本地排序，用户无从得知）。 */
function setFallbackBanner(on){
  const el = document.getElementById("fallbackBanner");
  if (el) el.style.display = on ? "block" : "none";
}

/** 拉最近 200 条作答流水，建「这张卡上次是什么时候、什么结果」的索引。 */
function fetchLastSeen(){
  return API.get("/api/history?n=200").then(r => {
    const m = {};
    for (const h of (r && r.history) || []){
      const id = h.word + "#" + h.senseId;
      if (!m[id]) m[id] = { result: h.result, ts: h.ts };   // 流水按新→旧，首见即最近
    }
    LASTSEEN = m;
  }).catch(() => {});
}

/** 本轮构成：几张没见过（新）、几张见过（复学）。 */
function roundMeta(queue){
  let review = 0;
  for (const id of queue) if (LASTSEEN[id]) review++;
  return { fresh: queue.length - review, review };
}
function hasRows(c){
  return Array.isArray(c.sentences) && c.sentences.length > 0;
}
function shuffle(a){
  const r = a.slice();
  for (let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

function buildOptions(c){
  // 干扰项：同词他义（TRAP 优先） -> 跨词同义池
  const same = CARDS
    .filter(x => x.word === c.word && x.senseId !== c.senseId)
    .sort((a,b) => b.trap - a.trap);
  const opts = [{zh: c.gloss, kind: "correct", id: c.id}];
  for (const s of same){
    if (opts.length >= 4) break;
    if (!opts.some(o => o.zh === s.gloss)) opts.push({zh: s.gloss, kind: "same"});
  }
  // 跨词补足
  const need = 4 - opts.length;
  if (need > 0){
    const cand = shuffle(GLOSS.filter(g => g && !opts.some(o => o.zh === g)));
    for (const g of cand){ if (opts.length >= 4) break; opts.push({zh: g, kind: "cross"}); }
  }
  return shuffle(opts);
}

function nextRow(c){
  if (!hasRows(c)) return null;   // D16：无句义项
  // 服务端给的可���下标里挑（已剔除被标记的问题句）；没有就退回全量
  const live = SERVER_LIVE[c.id];
  const pool = (live && live.length) ? live : c.sentences.map((_, i) => i);
  const i = pool[(state.rowIdx[c.id] || 0) % pool.length];
  state.rowIdx[c.id] = ((state.rowIdx[c.id] || 0) + 1) % pool.length;
  return c.sentences[i];
}

function loadCard(id){
  const c = CARDS.find(x => x.id === id);
  if (!c) { nextCard(); return; }
  card = c;
  row = nextRow(c);
  revealed = false; answered = false; renderedOptions = null;
  cardShownAt = Date.now();     // D17：用来算作答耗时，供 SRS 判快/慢
  if (!row){ renderNoSentence(); return; }   // D16：无句状态
  options = buildOptions(c);
  renderQuestion();
}

/* D16：该义项还没有例句。
   这是词库先行、句子后补的正常状态，不是错误——
   所以给它一个诚实的说明，而不是空白页或崩溃。 */
function renderNoSentence(){
  const g = c => document.getElementById(c);
  g("sentence").innerHTML =
    `<div class="nosent">
       <div class="nosent-title">${esc(card.word)} <span class="nosent-pos">${esc(card.pos)}</span></div>
       <div class="nosent-gloss">${esc(card.gloss)}</div>
       <div class="nosent-note">这个义项还没有例句。</div>
       <div class="nosent-sub">例句由句子生成流水线产出，需要启用 LLM 通道后批量生成。</div>
     </div>`;
  g("wordBadge").textContent = card.word;
  g("wordBadge").className = canSpeak() ? "speakable" : "";
  g("wordBadge").onclick = canSpeak() ? speakWord : null;
  g("tagLine").innerHTML = `<span>${esc(card.pos)}</span>` +
    (card.ipa ? ` <span class="ipa">/${esc(card.ipa)}/</span>` : "") +
    (card.tier ? ` <span class="tier">${esc(card.tier)}</span>` : "") +
    (card.trap ? ' <span class="trap">TRAP · 熟词僻义</span>' : "");
  g("blankBox").style.display = "none";
  g("giveupStage1").style.display = "none";
  g("options").style.display = "none";
  g("options").innerHTML = "";
  g("explain").style.display = "none";
  g("explain").innerHTML = "";
  g("actions").style.display = "flex";
  g("actions").innerHTML = `<button class="btn primary" onclick="nextCard()">下一题</button>`;
  g("hint").textContent = "";
  g("soloBanner").style.display = solo ? "block" : "none";
  updateProgress();
}

/* =========================================================================
   判分
   ========================================================================= */
function recordWrong(kind){
  const id = card.id;
  if (!state.wrong[id]) state.wrong[id] = {id, w: card.word, s: card.senseId, zh: card.gloss, wrongCount: 0, lastKind: null};
  state.wrong[id].wrongCount++;
  state.wrong[id].lastKind = kind;
}

function choose(o, node, key){
  if (answered) return;
  answered = true;
  document.querySelectorAll(".opt").forEach(n => n.classList.add("disabled"));
  document.getElementById("hint").textContent = "";
  const shownAt = cardShownAt || Date.now();
  let status, result;
  if (o.kind === "pending"){
    state.stats.pending++; status = "pending"; result = "PENDING";
    recordWrong("pending");
    if (solo) solo.chain = 0;
  } else if (o.kind === "correct"){
    state.stats.correct++; status = "good"; result = "CORRECT";
    node.classList.add("correct");
    if (solo) solo.chain = (solo.chain || 0) + 1;
  } else {
    state.stats.wrong++; status = "bad"; result = "WRONG";
    node.classList.add("wrong");
    if (renderedOptions){
      renderedOptions.nodes.forEach((n,i) => {
        const k = renderedOptions.shuffle[i];
        if (k === "correct") n.classList.add("correct");
        else if (n !== node) n.classList.add("dim");
      });
    }
    recordWrong("wrong");
    if (solo) solo.chain = 0;
  }
  commitAnswer(result, Date.now() - shownAt);   // D17：SRS 在服务端算
  saveState();
  updateProgress();
  showExplain(status, node, key);
}

function markMastered(id){
  state.mastered[id] = true;
  delete state.wrong[id];
  commitMastered(id);      // D17：服务端同步置 mastered，重排到期
  saveState();
  const exp = document.getElementById("explain");
  const line = exp.querySelector(".master-line") || exp.querySelector(".mastered-line");
  if (line) line.outerHTML = `<div class="note mastered-line">✓ 已标记「我已学会」</div>`;
  renderBoard();
  updateProgress();
}

function nextCard(){
  if (solo){ exitSolo(); return; }
  state.pos++;
  saveState();
  if (state.pos >= state.queue.length){ renderSummary(); return; }
  loadCard(state.queue[state.pos]);
}

function exitSolo(){
  solo = null;
  document.getElementById("soloBanner").style.display = "none";
  switchTab("board");
}

function startSolo(id){
  solo = {id, chain: 0};
  switchTab("train");
  loadCard(id);
}

function newRound(){
  SERVER_LIVE = {};
  // 先向服务端要到期队列（SRS 排期 + 剔除已标记的问题句）；
  // 拿不到就退回前端自己的排法（离线 / 纯静态打开）。
  Promise.all([fetchQueue(20), fetchLastSeen()]).then(([q]) => {
    setFallbackBanner(!q);                       // 降级要显式，别让用户猜
    state.queue = (q && q.ids && q.ids.length) ? q.ids : pickQueue(20);
    ROUND_META = roundMeta(state.queue);
    state.pos = 0;
    state.stats = {correct:0, wrong:0, pending:0};
    state.rowIdx = {};
    solo = null;
    saveState();
    switchTab("train");
    if (!state.queue.length){ renderSummary(); return; }
    loadCard(state.queue[0]);
  });
}

/* =========================================================================
   渲染
   ========================================================================= */
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function renderQuestion(){
  // 高亮**要猜义项的那个词**（目标词），不是句中别处的提示词。
  // 顶部徽章虽然也显示目标词，但句子里的第二次指示才告诉眼睛"看这里"。
  // 定位优先用数据里的 span（由 sentence_audit.py --fix-spans 按目标词机械重算），
  // 缺失或对不上时回退到词形正则。
  const t = row.text;
  let html;
  // k 是目标词在句中的实际词形（laid / cast / running…），由 build_bundle 机械算出。
  // 优先直接按 span 切；span 缺失或对不上时回退到以 k（或原形）做词形正则。
  const spanOk = typeof row.spanStart === "number" && row.spanStart >= 0 && row.spanStart + row.spanLen <= t.length;
  if (spanOk){
    html = esc(t.slice(0, row.spanStart)) + "<mark>" + esc(t.slice(row.spanStart, row.spanStart + row.spanLen)) + "</mark>" + esc(t.slice(row.spanStart + row.spanLen));
  } else {
    const stem = (row.form || card.word).replace(/[-\\^$*+?.()|[\]{}]/g, "\\$&");
    html = esc(t).replace(new RegExp(`\\b(${stem}[a-z]*)\\b`, "ig"), m => `<mark>${m}</mark>`);
  }
  document.getElementById("sentence").innerHTML = html;
  const badge = document.getElementById("wordBadge");
  badge.textContent = card.word;
  badge.className = canSpeak() ? "speakable" : "";
  badge.onclick = canSpeak() ? speakWord : null;
  badge.title = canSpeak() ? "点一下朗读" : "";
  document.getElementById("tagLine").innerHTML =
    `<span>${esc(card.pos)}</span>` +
    (card.ipa ? ` <span class="ipa">/${esc(card.ipa)}/</span>` : "") +
    (card.tier ? ` <span class="tier">${esc(card.tier)}</span>` : "") +
    (card.trap ? ' <span class="trap">TRAP · 熟词僻义</span>' : "");

  // 复学标记：见过就明说「上次什么时候、什么结果」，
  // 消除「怎么又是这个词」的困惑——它确实是复学卡，不是新卡。
  const meta = document.getElementById("cardMeta");
  const last = LASTSEEN[card.id];
  if (last){
    const agoH = Math.max(0, (Date.now() / 1000 - last.ts) / 3600);
    const ago = agoH >= 24 ? (agoH / 24).toFixed(1) + " 天前"
             : agoH >= 1 ? Math.round(agoH) + " 小时前" : "刚刚";
    const what = last.result === "WRONG" ? "答错"
               : last.result === "PENDING" ? "标了「我不会」" : "答对过";
    meta.textContent = `复学卡 · 上次${what} · ${ago}`;
    meta.style.display = "block";
  } else {
    meta.style.display = "none";
  }

  document.getElementById("blankBox").style.display = "flex";
  document.getElementById("giveupStage1").style.display = "block";
  document.getElementById("options").style.display = "none";
  document.getElementById("options").innerHTML = "";
  document.getElementById("explain").innerHTML = "";
  document.getElementById("explain").style.display = "none";
  document.getElementById("actions").style.display = "none";
  document.getElementById("hint").textContent = "想清楚这个词在这句里的意思…";
  document.getElementById("soloBanner").style.display = solo ? "block" : "none";
  updateProgress();
}

function updateProgress(){
  if (!state) return;
  const total = state.queue.length || 0;
  const inSolo = !!solo;
  const label = inSolo ? "单挑" : `第 ${Math.min(state.pos+1, total)} / ${total} 题`;
  document.getElementById("progressText").textContent = total ? label : "未开始";
  const pct = total ? Math.min(100, (state.pos / total) * 100) : 0;
  document.getElementById("progressFill").style.width = `${pct}%`;
  const s = state.stats;
  const masteredCount = Object.keys(state.mastered).length;
  // 池子真相：一共多少词/义项、当前到期多少、本轮新旧构成。
  // 以前这些全藏在服务端里，用户只能靠体感猜「怎么老是这几个词」。
  let extra = ` &nbsp;·&nbsp; 池 ${WORD_TOTAL} 词 / ${CARDS.length} 义`;
  extra += ` · 到期 ${DUE_TOTAL != null ? DUE_TOTAL : "—"}`;
  if (ROUND_META) extra += ` · 本轮 新 ${ROUND_META.fresh} / 复 ${ROUND_META.review}`;
  document.getElementById("statsLine").innerHTML =
    `对 <b>${s.correct}</b> · 错 <b>${s.wrong}</b> · 不会 <b>${s.pending}</b> · 已掌握 <b>${masteredCount}</b> / ${CARDS.length}${extra}`;
}

function revealOptions(){
  if (revealed || answered) return;
  revealed = true;
  document.getElementById("hint").textContent = "选择一个义项";
  document.getElementById("blankBox").style.display = "none";
  document.getElementById("giveupStage1").style.display = "none";
  const list = document.getElementById("options");
  list.style.display = "grid";
  list.innerHTML = "";
  const shuffled = options.slice();
  const nodes = [], kinds = [];
  shuffled.forEach((o,i) => {
    const d = document.createElement("div");
    d.className = "opt";
    const key = "ABCD"[i];
    d.innerHTML = `<span class="key">${key}</span><span class="body">${esc(o.zh)}</span>`;
    d.onclick = () => choose(o, d, key);
    list.appendChild(d);
    nodes.push(d); kinds.push(o.kind);
  });
  const d = document.createElement("div");
  d.className = "opt full";
  d.innerHTML = `<span class="key">E</span><span class="body">我不会</span>`;
  d.onclick = () => choose({kind:"pending"}, d, "E");
  list.appendChild(d);
  renderedOptions = {nodes, shuffle: kinds};
}

function giveUpNow(){
  choose({kind:"pending"}, document.getElementById("giveupStage1"), "");
}

function showExplain(status, node, key){
  const exp = document.getElementById("explain");
  exp.className = "explain";
  exp.style.display = "block";
  const correct = options.find(o => o.kind === "correct");
  const meta = {
    good:     {icon:"✓", label:"正确",   cls:"good"},
    bad:      {icon:"✕", label:"答错",   cls:"bad"},
    pending:  {icon:"·", label:"我不会", cls:"pending"},
  }[status];
  const isMastered = !!state.mastered[card.id];
  const masterBtn = isMastered
    ? `<div class="note mastered-line">✓ 已标记「我已学会」</div>`
    : `<div class="note master-line"><a onclick="markMastered('${card.id}')">我已学会</a></div>`;

  exp.innerHTML =
    `<div class="result-row ${meta.cls}"><span class="chip">${meta.icon} ${meta.label}</span>` +
    `<span class="correct-ans">正确答案 <b>${esc(correct.zh)}</b></span></div>` +
    `<div class="trans"><b>译文：</b>${esc(row.translation)}</div>` +
    `<div class="note">${esc(row.note)}</div>` + masterBtn +
    `<div class="note flag-line"><span>这句有问题？</span>` +
    `<input class="flag-input" id="flagNote" placeholder="备注（可空）" maxlength="60">` +
    `<button class="btn tiny" id="flagGo" onclick="flagSentence()">提交</button></div>` +
    `<div class="note flag-hint">标了之后这句不会再出现；下一题不会自动提交。</div>`;

  const act = document.getElementById("actions");
  act.style.display = "flex";
  act.innerHTML = "";
  const mk = (cls, txt, fn) => { const b=document.createElement("button"); b.className=`btn ${cls}`; b.textContent=txt; b.onclick=fn; act.appendChild(b); return b; };

  if (solo){
    if (solo.chain >= 2){
      delete state.wrong[solo.id];
      saveState();
      const doneId = solo.id, doneWord = card.word, doneZh = correct.zh;
      solo = null;
      document.getElementById("soloBanner").style.display = "none";
      renderBoard();
      const note = document.createElement("div");
      note.className = "note solo-done";
      note.textContent = `恭喜：${doneWord}「${doneZh}」已从错题板移出`;
      exp.appendChild(note);
      mk("primary", "返回错题板", () => switchTab("board"));
    } else {
      mk("primary", "再来一题", () => loadCard(solo.id));
      mk("ghost", "返回错题板", () => { exitSolo(); });
    }
  } else {
    const last = state.pos + 1 >= state.queue.length;
    mk("primary", last ? "看小结" : "下一题", nextCard);
    mk("ghost", "标记「我已学会」", () => markMastered(card.id));
  }
}

function switchTab(name){
  const vTrain = document.getElementById("viewTrain");
  const vBoard = document.getElementById("viewBoard");
  const vHistory = document.getElementById("viewHistory");
  const vSum = document.getElementById("viewSummary");
  const tabs = {train:"tabTrain", board:"tabBoard", history:"tabHistory"};
  const views = {train:vTrain, board:vBoard, history:vHistory};
  for (const k in views){
    const on = (k === name);
    views[k].style.display = on ? "block" : "none";
    document.getElementById(tabs[k]).classList.toggle("active", on);
  }
  vSum.style.display = "none";
  if (name === "board") renderBoard();
  if (name === "history") renderHistory();
}

/** 学过的题。数据在服务端 review_log（作答流水），本地不存副本。 */
function renderHistory(){
  const list = document.getElementById("historyList");
  const cnt = document.getElementById("historyCount");
  list.innerHTML = `<div class="board-empty">正在读取…</div>`;
  API.get("/api/history?n=80").then(r => {
    const h = (r && r.history) || [];
    cnt.textContent = h.length ? `最近 ${h.length} 条` : "";
    if (!h.length){
      list.innerHTML = `<div class="board-empty">还没有作答记录。</div>`;
      return;
    }
    const mark = {CORRECT:"✓ 对", WRONG:"✕ 错", PENDING:"· 不会"};
    const cls  = {CORRECT:"cold", WRONG:"hot", PENDING:""};
    list.innerHTML = h.map(x => {
      const d = new Date(x.ts * 1000);
      const when = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      return `<div class="worst-item">
        <span class="badge ${cls[x.result]}">${mark[x.result] || x.result}</span>
        <div><div class="word">${esc(x.word)} <span class="sub">${esc(x.zh)}</span></div>
        <div class="sub">${esc(x.sentence)}</div></div>
        <span class="go">${when}</span>
      </div>`;
    }).join("");
  }).catch(() => {
    list.innerHTML = `<div class="board-empty">读取失败（没连上服务？）。</div>`;
  });
}

function renderBoard(){
  if (!state) return;                 // 数据未就绪时避免崩溃
  const items = Object.values(state.wrong)
    .sort((a,b) => b.wrongCount - a.wrongCount || a.w.localeCompare(b.w));
  document.getElementById("boardCount").textContent = `${items.length} 个对子`;
  const list = document.getElementById("boardList");
  list.innerHTML = "";
  if (!items.length){
    list.innerHTML = `<div class="board-empty">还没有错题。持续答题，点「我不会」的对子会出现在这里。</div>`;
    return;
  }
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "worst-item";
    const hot = it.wrongCount >= 3;
    d.innerHTML =
      `<span class="badge ${hot ? "hot" : "cold"}">${it.wrongCount}次</span>` +
      `<div><div class="word">${esc(it.w)}</div><div class="sub">${esc(it.zh)}</div></div>` +
      `<span class="go">›</span>`;
    d.onclick = () => startSolo(it.id);
    list.appendChild(d);
  });
}

function renderSummary(){
  if (!state) return;
  const vTrain = document.getElementById("viewTrain");
  const vBoard = document.getElementById("viewBoard");
  const vSum = document.getElementById("viewSummary");
  vTrain.style.display = "none"; vBoard.style.display = "none";
  vSum.style.display = "block";
  document.getElementById("tabTrain").classList.remove("active");
  document.getElementById("tabBoard").classList.add("active");

  const items = Object.values(state.wrong);
  const miss = items.map(it =>
    `<span class="miss-item" onclick="startSolo('${it.id}')">${esc(it.w)}「${esc(it.zh)}」</span>`);
  const s = state.stats;
  const answered = s.correct + s.wrong + s.pending;
  const acc = answered ? Math.round(s.correct / answered * 100) : 0;

  // D16：所有义项都没有例句时，小结页要说清"为什么没题"，而不是"你答了 0 题"
  const playable = CARDS.filter(hasRows).length;
  if (!playable){
    vSum.innerHTML = `
      <div class="summary fade-enter">
        <h2>暂时没有可练的题目</h2>
        <div class="block">
          <div class="label">现状</div>
          <div class="stat-grid">
            <div class="stat"><b>${CARDS.length}</b><span>义项已入库</span></div>
            <div class="stat"><b>${playable}</b><span>有例句</span></div>
            <div class="stat pending"><b>${CARDS.length - playable}</b><span>待生成</span></div>
            <!-- 生成进行中时，额外显示进度条，让"正在逐词填充"可见 -->
          </div>
        </div>
        <div class="block">
          <div class="label">说明</div>
          <div class="done-line">
            词库已按 D15 重建（${CARDS.length} 个义项，来自 ECDICT）。
            例句正在按 T1 高频词逐词生成，目前完成 ${playable} 个义项。
          </div>
        </div>
        <div class="actions">
          <button class="btn secondary" onclick="switchTab('board')">看错题板</button>
        </div>
      </div>`;
    return;
  }

  vSum.innerHTML = `
    <div class="summary fade-enter">
      <h2>本场完成</h2>
      <div class="block">
        <div class="label">统计</div>
        <div class="stat-grid">
          <div class="stat good"><b>${s.correct}</b><span>对</span></div>
          <div class="stat bad"><b>${s.wrong}</b><span>错</span></div>
          <div class="stat pending"><b>${s.pending}</b><span>不会</span></div>
          <div class="stat"><b>${acc}%</b><span>正确率</span></div>
        </div>
      </div>
      <div class="block">
        <div class="label">错过（点击单挑）</div>
        ${miss.length ? `<div class="miss-list">${miss.join("")}</div>` : `<div class="done-line">本场没有错过</div>`}
      </div>
      <div class="block">
        <div class="label">累计</div>
        <div class="done-line">已掌握 ${Object.keys(state.mastered).length} / ${CARDS.length} 个对子；错题板 ${items.length} 个</div>
      </div>
      <div class="actions">
        <button class="btn secondary" onclick="switchTab('board')">看错题板</button>
        <button class="btn primary" onclick="newRound()">再来一轮</button>
      </div>
    </div>`;
}

/* =========================================================================
   启动
   ========================================================================= */
function boot(){
  const load = document.getElementById("loading");
  fetch(BUNDLE_URL)
    .then(r => r.json())
    .then(b => {
      BUNDLE = b;
      CARDS = b.cards;
      GLOSS = b.glossPool;
      WORD_TOTAL = new Set(CARDS.map(c => c.word)).size;
      if (load) load.remove();
      state = loadState();
      // D17：本地没有存档时，从 SQLite 恢复这一轮（换机器/清缓存后接着练）
      return restoreFromServer().then(restored => {
        if (restored && load) load.textContent = "";
        // 恢复未完成的一轮。也要先取 live：否则恢复出来的这一轮
        // 会把已标记的问题句再考一遍（SERVER_LIVE 空 -> nextRow 用全量下标）。
        return Promise.all([fetchQueue(20), fetchLastSeen()]).then(([q]) => {
          setFallbackBanner(!q);                     // 降级要显式，别让用户猜
          if (state.queue.length && state.pos < state.queue.length){
            ROUND_META = roundMeta(state.queue);
            switchTab("train");
            loadCard(state.queue[state.pos]);
            renderBoard();
            return;
          }
          if (state.queue.length && state.pos >= state.queue.length){
            // 上一轮已做完 -> 回到小结，而不是静默开新一轮
            ROUND_META = roundMeta(state.queue);
            renderSummary();
            renderBoard();
            return;
          }
          // 全新一轮：用服务端按 SRS 排好的队列
          state.queue = (q && q.ids && q.ids.length) ? q.ids : pickQueue(20);
          ROUND_META = roundMeta(state.queue);
          state.pos = 0;
          saveState();
          if (state.queue.length){ switchTab("train"); loadCard(state.queue[0]); }
          else renderSummary();
          renderBoard();
        });
      });
    })
    .catch(e => {
      if (load) load.textContent = "数据加载失败：" + e.message;
    });
}
boot();

</script>
