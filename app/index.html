<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背单词 · 最小循环</title>
<style>
  :root { --bg:#111417; --card:#1b1f24; --line:#2a3038; --fg:#e6e9ec;
          --dim:#8b949e; --ok:#3fb950; --bad:#f85149; --pend:#d29922; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 8px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:12px; color:var(--dim); }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line);
           background:var(--card); color:var(--fg); padding:12px 16px; }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  .primary { background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:600; }
  .wide { width:100%; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin:16px 0; }
  .word { font-size:28px; font-weight:600; }
  .meta { color:var(--dim); font-size:13px; margin-bottom:12px; }
  .sent { font-size:19px; line-height:1.9; margin:12px 0 20px; }
  mark { background:transparent; color:var(--acc); border-bottom:2px solid var(--acc); padding:0 1px; }
  .opts { display:grid; gap:8px; }
  .opt { text-align:left; padding:14px 16px; }
  .opt.right { border-color:var(--ok); background:rgba(63,185,80,.12); }
  .opt.miss { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .fb { margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); font-size:15px; }
  .fb .tr { color:var(--fg); }
  .fb .nt { color:var(--dim); font-size:13px; margin-top:8px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:20px;
         border:1px solid var(--line); color:var(--dim); margin-left:6px; vertical-align:middle; }
  .tag.trap { color:var(--bad); border-color:var(--bad); }
  .tag.tr { color:var(--pend); border-color:var(--pend); }
  .srs { margin-top:12px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .bar .fill { height:3px; background:var(--acc); border-radius:3px; flex:1; }
  .bar .bg { height:3px; background:var(--line); border-radius:3px; flex:1; }
  .hide { display:none; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { padding:5px 6px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child,th:first-child { text-align:left; }
  .warn { color:var(--pend); }
</style>
</head>
<body>
<div class="wrap">

  <h1>背单词</h1>
  <div class="sub" id="sub">载入中…</div>

  <!-- 首页 -->
  <section id="home">
    <div class="stats">
      <div class="stat"><b id="s-due">–</b><span>今日到期</span></div>
      <div class="stat"><b id="s-mastered">–</b><span>已掌握</span></div>
      <div class="stat"><b id="s-wrong">–</b><span>错题</span></div>
      <div class="stat"><b id="s-answered">–</b><span>累计作答</span></div>
    </div>
    <button class="primary wide" id="btn-start">开始今天的学习</button>
    <div class="sub" style="margin-top:14px" id="pool-note"></div>
    <div id="acc-box" class="hide">
      <div class="meta">每日正确率（只算到期卡次）</div>
      <table id="acc-table"></table>
    </div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="hide">
    <div class="bar">
      <div class="bg"><div class="fill" id="prog" style="width:0%"></div></div>
      <span class="meta" id="pos"></span>
    </div>
    <div class="q">
      <div class="word"><span id="q-word"></span><span class="tag" id="q-tier"></span></div>
      <div class="meta" id="q-pos"></div>
      <div class="sent" id="q-sent"></div>
      <div class="opts" id="q-opts"></div>
      <div class="fb hide" id="q-fb">
        <div class="tr" id="fb-tr"></div>
        <div class="nt" id="fb-nt"></div>
        <div class="srs" id="fb-srs"></div>
        <button class="primary wide" id="btn-next" style="margin-top:14px">下一题</button>
      </div>
    </div>
    <button class="wide" id="btn-reveal">显示选项（先自己回忆）</button>
  </section>

  <!-- 小结 -->
  <section id="done" class="hide">
    <h1 style="margin-bottom:12px">这一场练完了</h1>
    <div class="stats">
      <div class="stat"><b id="d-asked">0</b><span>作答</span></div>
      <div class="stat"><b id="d-correct">0</b><span>答对</span></div>
      <div class="stat"><b id="d-wrong">0</b><span>答错</span></div>
      <div class="stat"><b id="d-pending">0</b><span>不会</span></div>
    </div>
    <div class="sub" id="d-note"></div>
    <button class="primary wide" id="btn-again">回到首页</button>
  </section>

</div>
<script src="/app.js"></script>
</body>
</html>
